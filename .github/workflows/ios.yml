name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project FireSurvey.xcodeproj -scheme FireSurvey \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned device app (.ipa)
        run: |
          xcodebuild -project FireSurvey.xcodeproj -scheme FireSurvey \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FireSurvey.app Payload/
          zip -qr FireSurvey-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: fire-extinguisher-survey-unsigned-ipa
          path: ios/FireSurvey-unsigned.ipa
