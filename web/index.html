<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fire Extinguisher Survey</title>
  <meta name="description" content="Scan fire extinguisher QR codes and record survey results.">
  <meta name="theme-color" content="#b71c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ext. Survey">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">

<body>
  <header class="appbar">
    <button class="icon-btn" id="back-btn" hidden aria-label="Back">

  <script src="app.js"></script>
